# Venus Atmospheric Particle Retrieval
# Conda environment for Bayesian inference on Pioneer Venus nephelometer data
#
# Create environment: conda env create -f environment.yml
# Activate: conda activate venus-retrieval

name: venus-retrieval
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python>=3.8

  # Scientific computing
  - numpy>=1.20.0
  - scipy>=1.7.0
  - pandas>=1.3.0

  # Visualization
  - matplotlib>=3.4.0

  # pip-only packages
  - pip
  - pip:
      # Mie scattering calculations
      - miepython>=2.3.0
      # Nested sampling
      - dynesty>=2.1.0
      # Posterior visualization
      - corner>=2.2.0
      # Kernel density estimation
      - KDEpy>=1.1.0
